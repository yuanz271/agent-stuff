version: 1

planner:
  model: openai/gpt-5.4
  thinking: high
  # Built-in Pi tools are: read, write, edit, bash.
  # write and edit stay excluded so the planner remains read-only.
  # bash is enabled for read-only commands only; mutating commands are blocked by planner-builder runtime checks.
  # planner_builder is force-added by the extension regardless of this list.
  allowed_tools:
    - read
    - bash
    - websearch

builder:
  model: openai/gpt-5.4-mini
  thinking: medium
